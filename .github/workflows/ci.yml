name: Newsatoshi L1 CI

on:
  push:
    branches: [main, feat/rfc-0021-op-verify-covenant-stark]
  pull_request:

jobs:
  l1-core:
    name: Newsatoshi L1 Core (Priorism-FEP + Pure SHA-2 STARKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - working-directory: node
        run: |
          node ../verifier-ts/newsatoshi_verifier.mjs --self-test
          cargo test --lib
          cargo test --release --test priorism_fep_core --test payword_channel --test audit_redteam --test differential_fuzz --test attacks --test discovery --test crypto_kats --test conds --test auxpow --test locks --test light --test mainnet_params --test chain
          cargo build --bin newsatoshi --example channel_http_harness --example extract_lean_spend
          cargo run --release --example extract_lean_spend -- /tmp/SpendBalance.lean
          diff -u proof/SpendBalance.lean /tmp/SpendBalance.lean
